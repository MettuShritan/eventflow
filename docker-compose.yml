services:
  db:
    image: postgres:16-alpine
    container_name: eventflow-db
    environment:
      POSTGRES_USER: eventflow
      POSTGRES_PASSWORD: eventflow
      POSTGRES_DB: eventflow
    volumes:
      - eventflow_db:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventflow -d eventflow"]
      interval: 5s
      timeout: 5s
      retries: 10
  eventflow:
    build: .
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://eventflow:eventflow@db:5432/eventflow?schema=public
      AUTH_SECRET: ${AUTH_SECRET:-change-this-in-production}
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-}
      BOOTSTRAP_CONDUCTOR_EMAIL: ${BOOTSTRAP_CONDUCTOR_EMAIL:-}
      BOOTSTRAP_CONDUCTOR_PASSWORD: ${BOOTSTRAP_CONDUCTOR_PASSWORD:-}
      BOOTSTRAP_CONDUCTOR_NAME: ${BOOTSTRAP_CONDUCTOR_NAME:-}
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npx prisma db push && npx prisma db seed && npm start"
volumes:
  eventflow_db:
